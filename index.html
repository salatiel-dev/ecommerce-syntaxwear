<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syntaxwear</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="page">
        <header class="site-header">
            <a class="logo" href="#">Syntaxwear</a>

            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">
            <section class="hero" aria-label="Main banner">
                <header class="hero-content">
                    <h1>Hero</h1>
                </header>
                <figure class="hero-media">
                    <img src="#" alt="" />
                </figure>
            </section>

            <section class="categories" aria-label="Sneaker categories">
                <h2>Categories</h2>
                <ul class="category-list">
                    <li>
                        <article class="category-item">Category</article>
                    </li>
                    <li>
                        <article class="category-item">Category</article>
                    </li>
                    <li>
                        <article class="category-item">Category</article>
                    </li>
                </ul>
            </section>

            <section class="products" aria-label="Featured products">
                <h2>Featured products</h2>
                <section class="product-grid" aria-label="Product list">
                    <article class="product-card">
                        <figure class="product-figure">
                            <img src="#" alt="" />
                            <figcaption>Product</figcaption>
                        </figure>
                    </article>
                    <article class="product-card">
                        <figure class="product-figure">
                            <img src="#" alt="" />
                            <figcaption>Product</figcaption>
                        </figure>
                    </article>
                    <article class="product-card">
                        <figure class="product-figure">
                            <img src="#" alt="" />
                            <figcaption>Product</figcaption>
                        </figure>
                    </article>
                </section>
            </section>
        </main>

        <footer class="site-footer" role="contentinfo">
            <section class="footer-contact" aria-label="Contact information">
                <h2>Contact</h2>
            </section>

            <nav class="footer-nav" aria-label="Useful links">
                <ul>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">WhatsApp</a></li>
                </ul>
            </nav>
        </footer>
    </div>
</body>

</html>
